<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sayfa bulunamadı | Quup Games</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#09090b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&amp;family=Saira+Condensed:wght@700;800&amp;display=swap">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background:
        radial-gradient(40% 40% at 50% 38%, rgba(255, 207, 112, 0.12), transparent 70%),
        #09090b;
      color: #f4f4f6;
      font: 400 1.0625rem/1.6 "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 34rem; display: grid; justify-items: center; gap: 16px; }
    svg { width: 120px; height: 116px; color: #fff; }
    .code {
      margin: 6px 0 0;
      font: 800 clamp(4.5rem, 3rem + 8vw, 8rem)/0.85 "Saira Condensed", "Arial Narrow", sans-serif;
      color: #ffd21f;
      letter-spacing: 0.02em;
    }
    h1 { margin: 0; font: 800 clamp(1.9rem, 1.4rem + 2vw, 2.6rem)/1 "Saira Condensed", "Arial Narrow", sans-serif; text-transform: uppercase; }
    p { margin: 0; color: #a1a1ad; }
    a {
      margin-top: 12px;
      display: inline-flex;
      align-items: center;
      min-height: 52px;
      padding: 0.75em 1.5em;
      border-radius: 14px;
      background: linear-gradient(180deg, #ffe46b, #ffd21f 55%);
      box-shadow: 0 5px 0 #a38100, inset 0 1.5px 0 rgba(255, 255, 255, 0.6);
      color: #0b0b0d;
      font: 800 1.15rem/1 "Saira Condensed", "Arial Narrow", sans-serif;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
    }
    a:active { transform: translateY(5px); box-shadow: 0 0 0 #a38100; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 638 619" aria-hidden="true"><path fill="currentColor" d="M452.10 581.10A308 308 0 1 1 553.92 494.92L638 579V619H555L324 388H447L490.17 431.17A219 219 0 1 0 384.85 513.85Z"/></svg>
    <p class="code">404</p>
    <h1>Bu dosya kayıp</h1>
    <p>Aradığın sayfa taşınmış ya da hiç var olmamış olabilir. Ana sayfaya dönüp izi yeniden sür.</p>
    <a id="home" href="/">Ana sayfaya dön</a>
  </main>
  <script>
    // Project sites on GitHub Pages live under /<repo>/, so point the button there.
    (function () {
      var seg = location.pathname.split('/').filter(Boolean)[0];
      if (/\.github\.io$/.test(location.hostname) && seg) document.getElementById('home').href = '/' + seg + '/';
    })();
  </script>
</body>
</html>
