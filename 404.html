<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seviye bulunamadı | Zorbzilla Games</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#140c2b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&amp;family=Paytone+One&amp;display=swap">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background:
        radial-gradient(50% 45% at 50% 40%, rgba(123, 92, 255, 0.45), transparent 70%),
        radial-gradient(30% 30% at 80% 80%, rgba(255, 79, 154, 0.3), transparent 70%),
        #140c2b;
      color: #fff7ea;
      font: 400 1.0625rem/1.6 "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 34rem; display: grid; justify-items: center; gap: 18px; }
    svg { width: 132px; height: 132px; }
    .code {
      margin: 0;
      font: 400 clamp(4.5rem, 3rem + 8vw, 8rem)/0.9 "Paytone One", "Arial Rounded MT Bold", sans-serif;
      color: #ffc43d;
      -webkit-text-stroke: 0.07em #0a0518;
      paint-order: stroke fill;
      text-shadow: 0 0.08em 0 #0a0518;
    }
    h1 { margin: 0; font: 400 clamp(1.7rem, 1.3rem + 2vw, 2.4rem)/1.1 "Paytone One", "Arial Rounded MT Bold", sans-serif; }
    p { margin: 0; color: #b7aedb; }
    a {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      min-height: 52px;
      padding: 0.75em 1.5em;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffe08a, #ffc43d 55%);
      box-shadow: 0 6px 0 #d9820f, inset 0 2px 0 rgba(255, 255, 255, 0.55);
      color: #2a1600;
      font: 400 1.15rem/1 "Paytone One", "Arial Rounded MT Bold", sans-serif;
      text-decoration: none;
    }
    a:active { transform: translateY(6px); box-shadow: 0 0 0 #d9820f; }
    a:focus-visible { outline: 3px solid #fff7ea; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M14.5 15.5 10 3.5l12.5 8z" fill="#ffc43d"/>
      <path d="M49.5 15.5 54 3.5l-12.5 8z" fill="#ffc43d"/>
      <path d="M32 8c14.9 0 25.5 9.8 25.5 24v7.5C57.5 52 46.8 59 32 59S6.5 52 6.5 39.5V32C6.5 17.8 17.1 8 32 8z" fill="#3ddc97"/>
      <circle cx="32" cy="30" r="12.5" fill="#fff7ea"/>
      <circle cx="28" cy="33" r="6.5" fill="#140c2b"/>
      <circle cx="30" cy="30.6" r="2.1" fill="#fff7ea"/>
      <path d="M22 48c3-3 6.5-4.5 10-4.5s7 1.5 10 4.5" fill="none" stroke="#140c2b" stroke-width="3.2" stroke-linecap="round"/>
    </svg>
    <p class="code">404</p>
    <h1>Bu seviye bulunamadı</h1>
    <p>Aradığın sayfa taşınmış ya da hiç var olmamış olabilir. Ana menüye dönüp yeniden dene.</p>
    <a id="home" href="/">Ana sayfaya dön</a>
  </main>
  <script>
    // Project sites on GitHub Pages live under /<repo>/, so point the button there.
    (function () {
      var seg = location.pathname.split('/').filter(Boolean)[0];
      if (/\.github\.io$/.test(location.hostname) && seg) document.getElementById('home').href = '/' + seg + '/';
    })();
  </script>
</body>
</html>
