<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sayfa bulunamadı | QuUp Games</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07080c">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&amp;family=Saira+Condensed:wght@700;800&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&amp;text=uUp%20Games&amp;display=swap">
  <!-- This page is served for any missing address (e.g. /games/a/b/), so everything it needs is inline. -->
  <style>
    :root {
      color-scheme: dark;
      --bg: #07080c;
      --blue: #4d7cff;
      --blue-hi: #86a6ff;
      --blue-edge: #1f3a9e;
      --muted: #a2a8bb;
      --line: rgba(255, 255, 255, 0.09);
    }
    * { box-sizing: border-box; }
    html { height: 100%; background: var(--bg); }
    body {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(46% 42% at 50% 44%, rgba(77, 124, 255, 0.2), transparent 70%),
        radial-gradient(30% 30% at 82% 12%, rgba(139, 108, 255, 0.12), transparent 70%),
        var(--bg);
      color: #f3f5fb;
      font: 400 1.0625rem/1.6 "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .mark {
      position: absolute;
      right: -8vw;
      bottom: -12vh;
      z-index: -1;
      width: min(62vw, 640px);
      height: auto;
      color: rgba(255, 255, 255, 0.03);
    }
    header,
    footer { width: min(100% - 32px, 1240px); margin-inline: auto; }
    header { display: flex; align-items: center; min-height: 76px; border-bottom: 1px solid var(--line); }
    .logo {
      display: inline-flex;
      align-items: baseline;
      color: #fff;
      font: 600 1.62rem/1 "Outfit", "Figtree", system-ui, sans-serif;
      letter-spacing: -0.02em;
      text-decoration: none;
      white-space: nowrap;
    }
    .logo svg { width: 0.763em; height: 0.74em; overflow: visible; }
    .logo em { margin-left: 0.26em; font-style: normal; }
    main {
      display: grid;
      flex: 1 0 auto;
      place-content: center;
      justify-items: center;
      gap: 14px;
      padding: 40px 16px 56px;
      text-align: center;
    }
    .code {
      margin: 0;
      background: linear-gradient(180deg, #fff 10%, var(--blue-hi) 60%, var(--blue) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font: 800 clamp(5.5rem, 3rem + 11vw, 10rem)/0.82 "Saira Condensed", "Arial Narrow", sans-serif;
      letter-spacing: 0.02em;
    }
    .tape {
      margin: 6px 0 10px;
      padding: 7px 18px 5px;
      background: repeating-linear-gradient(-45deg, var(--blue) 0 18px, #3f6cf0 18px 36px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      color: #fff;
      font: 800 1rem/1 "Saira Condensed", "Arial Narrow", sans-serif;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      transform: rotate(-2.5deg);
    }
    h1 {
      margin: 0;
      font: 800 clamp(2rem, 1.4rem + 2.4vw, 3rem)/1 "Saira Condensed", "Arial Narrow", sans-serif;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    p { max-width: 32rem; margin: 0; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 14px; }
    .btn {
      display: inline-flex;
      align-items: center;
      min-height: 52px;
      padding: 0.75em 1.5em;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(180deg, #7c9dff, var(--blue) 55%);
      box-shadow: 0 5px 0 var(--blue-edge), inset 0 1.5px 0 rgba(255, 255, 255, 0.45);
      color: #fff;
      font: 800 1.15rem/1 "Saira Condensed", "Arial Narrow", sans-serif;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .btn--ghost { background: rgba(255, 255, 255, 0.05); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.2); }
    .btn:active { transform: translateY(5px); box-shadow: 0 0 0 var(--blue-edge); }
    .btn--ghost:active { transform: translateY(2px); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.2); }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; border-radius: 8px; }
    footer {
      padding: 18px 0 max(18px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.86rem;
    }
    @media (prefers-reduced-motion: no-preference) {
      main > * { animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
      main > :nth-child(2) { animation-delay: 0.08s; }
      main > :nth-child(3) { animation-delay: 0.14s; }
      main > :nth-child(4) { animation-delay: 0.2s; }
      main > :nth-child(5) { animation-delay: 0.26s; }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
    }
  </style>
</head>
<body>
  <svg class="mark" viewBox="0 0 638 619" aria-hidden="true"><path fill="currentColor" d="M442.14 585.25A308 308 0 1 1 561.31 483.2L638 559.89V619H535.89L277.89 361H439.11L478.56 400.45A194 194 0 1 0 353.48 496.59Z"/></svg>
  <header>
    <a class="logo" href="/games/" data-path="" aria-label="QuUp Games ana sayfa" data-t="aria.home"><svg viewBox="0 0 638 619" aria-hidden="true"><path fill="currentColor" d="M442.14 585.25A308 308 0 1 1 561.31 483.2L638 559.89V619H535.89L277.89 361H439.11L478.56 400.45A194 194 0 1 0 353.48 496.59Z"/></svg><span aria-hidden="true">uUp<em>Games</em></span></a>
  </header>
  <main>
    <p class="code">404</p>
    <span class="tape" data-t="tape">Dosya bulunamadı</span>
    <h1 data-t="title">Bu dosya kayıp</h1>
    <p data-t="text">Aradığın sayfa taşınmış ya da hiç var olmamış olabilir. İzi yeniden sürmek için ana sayfaya dön.</p>
    <div class="actions">
      <a class="btn" href="/games/" data-path="" data-t="home">Ana sayfaya dön</a>
      <a class="btn btn--ghost" href="/games/games.html" data-path="games.html" data-t="games">Oyunlarımız</a>
    </div>
  </main>
  <footer>© <span id="year">2026</span> QuUp Games. <span data-t="rights">Tüm hakları saklıdır.</span></footer>
  <script>
    (function () {
      // A GitHub Pages project site lives under /<repo>/; on its own domain the site sits at /.
      var seg = location.pathname.split('/').filter(Boolean)[0];
      var base = /\.github\.io$/.test(location.hostname) && seg ? '/' + seg + '/' : '/';
      var links = document.querySelectorAll('[data-path]');
      for (var i = 0; i < links.length; i++) links[i].href = base + links[i].getAttribute('data-path');
      document.getElementById('year').textContent = new Date().getFullYear();
      // same as the rest of the site: no context menu, no source or developer-tools shortcuts
      document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      document.addEventListener('keydown', function (e) {
        var mod = e.ctrlKey || e.metaKey;
        var c = e.code;
        if (e.key === 'F12' || (mod && e.shiftKey && /^Key[IJC]$/.test(c)) || (mod && e.altKey && /^Key[IJCU]$/.test(c)) || (mod && !e.shiftKey && !e.altKey && /^Key[US]$/.test(c))) e.preventDefault();
      });

      // Same language as the rest of the site (main.js keeps it under "qg-lang").
      var lang = null;
      try { lang = localStorage.getItem('qg-lang'); } catch (e) { /* storage blocked */ }
      if (lang !== 'en') return;
      var EN = {
        'aria.home': 'QuUp Games home',
        tape: 'File not found',
        title: 'This file is missing',
        text: 'The page you are looking for may have moved or never existed. Head back home to pick up the trail.',
        home: 'Back to home',
        games: 'Our games',
        rights: 'All rights reserved.'
      };
      document.documentElement.lang = 'en';
      document.title = 'Page not found | QuUp Games';
      var els = document.querySelectorAll('[data-t]');
      for (var j = 0; j < els.length; j++) {
        var key = els[j].getAttribute('data-t');
        if (key.indexOf('aria.') === 0) els[j].setAttribute('aria-label', EN[key]);
        else els[j].textContent = EN[key];
      }
    })();
  </script>
</body>
</html>
